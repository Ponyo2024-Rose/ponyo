<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示範遊戲｜數光群島</title>
<style>
  body{margin:0;font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#fff8ec;color:#4a3a2c;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .box{background:#fff;border:4px solid #ead9b8;border-radius:24px;padding:28px;max-width:520px;width:90%;text-align:center}
  h1{font-size:22px;margin:0 0 6px}
  .q{font-size:34px;margin:18px 0}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{font-family:inherit;font-size:24px;padding:14px;border-radius:16px;border:3px solid #ead9b8;background:#fffaf0;cursor:pointer;color:#4a3a2c}
  button:hover{border-color:#2f9fb3}
  .msg{min-height:30px;font-size:18px;margin-top:14px}
  .note{font-size:13px;color:#9a8670;margin-top:18px}
</style>
</head>
<body>
<div class="box">
  <h1>🎮 示範小遊戲</h1>
  <div id="prog">第 1 題 / 共 3 題</div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="msg" id="msg"></div>
  <div class="note">這是示範用的遊戲：答對 3 題後，會自動通知數光群島「過關了」。</div>
</div>
<script>
  const Q = [
    { q: '12 ÷ 4 = ?', a: '3', o: ['3', '4', '6', '8'] },
    { q: '1/2 + 1/4 = ?', a: '3/4', o: ['2/6', '3/4', '1/3', '2/4'] },
    { q: '0.5 × 6 = ?', a: '3', o: ['30', '0.3', '3', '3.5'] }
  ];
  let i = 0;
  function show() {
    const c = Q[i];
    document.getElementById('prog').textContent = `第 ${i + 1} 題 / 共 ${Q.length} 題`;
    document.getElementById('q').textContent = c.q;
    const box = document.getElementById('opts'); box.innerHTML = '';
    c.o.forEach(v => {
      const b = document.createElement('button'); b.textContent = v;
      b.onclick = () => {
        if (v === c.a) {
          i++;
          if (i < Q.length) { document.getElementById('msg').textContent = '答對了！'; show(); }
          else finish();
        } else document.getElementById('msg').textContent = '再想想看～';
      };
      box.appendChild(b);
    });
  }
  function finish() {
    document.getElementById('q').textContent = '🎉 全部答對，過關！';
    document.getElementById('opts').innerHTML = '';
    document.getElementById('msg').textContent = '';
    // ★ 關鍵的一行：通知數光群島「過關了」
    window.parent.postMessage({ type: 'shuguang-complete' }, '*');
  }
  show();
</script>
</body>
</html>
